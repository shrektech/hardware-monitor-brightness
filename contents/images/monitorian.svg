<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <style id="current-color-scheme" type="text/css">
      .ColorScheme-Text {
        color: #232629;
      }
    </style>
  </defs>
  <g class="ColorScheme-Text" fill="currentColor" stroke="currentColor">
    <!-- Monitor Outer Bezel -->
    <rect x="2.5" y="2" width="19" height="12.2" rx="2" ry="2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Monitor Stand -->
    <path d="M10.5 14.2 v2.2 h-3.5 v1.6 h10 v-1.6 h-3.5 v-2.2" fill="currentColor" stroke="none"/>
    
    <!-- Symmetrical Sun Center -->
    <circle cx="12" cy="8.1" r="2.2" fill="currentColor" stroke="none"/>
    
    <!-- 8 Symmetrical Rays -->
    <line x1="12" y1="4.5" x2="12" y2="3.1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="12" y1="11.7" x2="12" y2="13.1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="8.4" y1="8.1" x2="7.0" y2="8.1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="15.6" y1="8.1" x2="17.0" y2="8.1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="9.45" y1="5.55" x2="8.45" y2="4.55" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="14.55" y1="10.65" x2="15.55" y2="11.65" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="9.45" y1="10.65" x2="8.45" y2="11.65" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="14.55" y1="5.55" x2="15.55" y2="4.55" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
  </g>
</svg>
